# Publishes a prerelease of every publishable package from `next` under the `next` dist-tag. It runs
# when a push to `next` changes .github/prerelease (edit that file to cut a prerelease), or by
# manual dispatch once this workflow is on the default branch.
# A run's version is the CLI's base version plus the run number (for example 0.20.0-next.42), and
# the CLI's optional dependencies name the same prerelease of the platform packages, so an install
# of the prerelease gets a matching dev host and ANGLE build. The publish job waits for a reviewer
# on the repository's `Release` environment. Stable releases still come from a version tag
# (release.yml); this workflow never moves the `latest` dist-tag.
name: prerelease

on:
  push:
    branches: [next]
    paths: [.github/prerelease]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: resolve the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the prerelease version
        id: version
        run: |
          base=$(node -p "require('./packages/cli/package.json').version.split('-')[0]")
          echo "version=$base-next.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # The CLI is one package for every platform, and ANGLE ships beside it for the Windows host.
  # Pack both once; each dev-host job hashes the CLI package it was built against.
  cli:
    name: pack the CLI and ANGLE
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the prerelease version
        run: node scripts/prerelease-version.mjs "${{ needs.version.outputs.version }}"
      - name: Pack the packages
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @native-sdk/cli pack --pack-destination "$RUNNER_TEMP/pack"
          pnpm --filter @native-sdk/angle-win32-x64 pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  dev-host:
    name: dev host (${{ matrix.key }})
    needs: [version, cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            os: ubuntu-22.04
          - key: linux-arm64
            os: ubuntu-22.04-arm
          - key: darwin-x64
            os: macos-15-intel
          - key: darwin-arm64
            os: macos-14
          # scriptc has no Windows libnode pack yet, so the dev host's Node island cannot be
          # built there; the job records a notice and the release carries the other four.
          - key: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The Linux host links cairo, freetype, fontconfig, harfbuzz, libpng, libjpeg, libgif,
      # dbus, ALSA, EGL, GL and sqlite; these are the packages its headers and archives come from.
      - name: Install the Linux host's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld pkg-config \
            libcairo2-dev libfreetype-dev libfontconfig-dev libharfbuzz-dev \
            libpng-dev libjpeg-dev libgif-dev libdbus-1-dev libasound2-dev \
            libegl-dev libgl-dev libgl1-mesa-dri libsqlite3-dev

      # scriptc links a Windows program with zig, so the host's objects are zig builds too.
      - name: Install zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "0.17.1"
          $root = "$env:RUNNER_TEMP\zig-$version"
          if (-not (Test-Path "$root\zig.exe")) {
            Invoke-WebRequest -UseBasicParsing "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
            Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig-unpack" -Force
            Move-Item "$env:RUNNER_TEMP\zig-unpack\zig-x86_64-windows-$version" $root
          }
          "$root" | Out-File -Append -FilePath $env:GITHUB_PATH
          & "$root\zig.exe" version

      - run: pnpm install --frozen-lockfile
      - name: Stamp the prerelease version
        run: node scripts/prerelease-version.mjs "${{ needs.version.outputs.version }}"

      # The dev host embeds a Node island, and scriptc builds one only against a libnode pack.
      - name: Check for this platform's libnode pack
        id: libnode
        shell: bash
        run: |
          if node --input-type=module -e 'import { libnodePackageName } from "./packages/cli/compiler/dev-host.ts"; process.exit(libnodePackageName() === null ? 1 : 0)'; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=win32-x64 dev host skipped::scriptc has no Windows libnode pack, so the dev host's Node island cannot be built."
          fi

      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/pack

      - name: Unpack the CLI package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-package"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/cli-package" --strip-components=1

      - name: Build the dev host into its package
        if: steps.libnode.outputs.supported == 'true'
        shell: bash
        run: node packages/cli/scripts/prebuilt-dev-host.ts "packages/dev-host-${{ matrix.key }}" --force --sdk-root "$RUNNER_TEMP/cli-package"

      - name: Pack the dev-host package
        if: steps.libnode.outputs.supported == 'true'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/packages" && (cd "packages/dev-host-${{ matrix.key }}" && pnpm pack --pack-destination "$RUNNER_TEMP/packages")

      - name: Check the package holds the host and its manifest
        if: steps.libnode.outputs.supported == 'true'
        shell: bash
        run: |
          tarball=$(ls "$RUNNER_TEMP"/packages/*.tgz)
          tar -tzf "$tarball" | grep -q -x -e 'package/host' -e 'package/host.exe'
          tar -tzf "$tarball" | grep -q -x 'package/host.json'

      - uses: actions/upload-artifact@v4
        if: steps.libnode.outputs.supported == 'true'
        with:
          name: dev-host-${{ matrix.key }}
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  publish:
    name: publish the prerelease
    needs: [version, cli, dev-host]
    runs-on: ubuntu-22.04
    # Each publish waits for a reviewer on the repository's `Release` environment
    # (Settings -> Environments -> Release -> Required reviewers).
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          pattern: "*"
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer for the OIDC exchange.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      # Platform packages first: the CLI's optional dependencies name them, so they exist before
      # the CLI that asks for them is published. `--tag next` leaves `latest` alone, and
      # `--provenance` attaches the run's signed build provenance to each tarball.
      - name: Publish the platform packages
        run: |
          for tarball in "$RUNNER_TEMP"/dist/native-sdk-*.tgz; do
            [ -e "$tarball" ] || continue
            meta=$(tar -xzOf "$tarball" package/package.json)
            name=$(printf '%s' "$meta" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            version=$(printf '%s' "$meta" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if [ "$name" = "@native-sdk/cli" ]; then continue; fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "$tarball" --tag next --provenance --access public
          done
      - name: Publish the CLI
        run: |
          for tarball in "$RUNNER_TEMP"/dist/native-sdk-cli-*.tgz; do
            [ -e "$tarball" ] || continue
            meta=$(tar -xzOf "$tarball" package/package.json)
            name=$(printf '%s' "$meta" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            version=$(printf '%s' "$meta" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "$tarball" --tag next --provenance --access public
          done
