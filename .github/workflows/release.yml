# Builds the dev host the first `native dev` would otherwise compile (four to five minutes of
# the SDK's runtime) once per platform, packs each into the optional package @native-sdk/cli
# depends on, and — on a version tag, or a manual run with `publish` — publishes the packages.
#
# Each host records the SDK digest of the CLI package exactly as `pnpm pack` ships it (see
# packages/cli/scripts/prebuilt-dev-host.ts), so an install only uses a host built from its own
# SDK; anything else falls back to building the host on that machine.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish @native-sdk/cli and the dev-host packages to npm"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The CLI is one package for every platform: pack it once, and let each dev-host job hash the
  # CLI package it was built against. `pnpm pack` (not npm's) rewrites workspace:* to versions.
  cli:
    name: pack the CLI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p "$RUNNER_TEMP/pack" && pnpm --filter @native-sdk/cli pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  dev-host:
    name: dev host (${{ matrix.key }})
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            os: ubuntu-22.04
          # GitHub's hosted arm64 images are `ubuntu-*-arm`; a plan without them uses a
          # self-hosted arm64 runner's label here instead.
          - key: linux-arm64
            os: ubuntu-22.04-arm
          - key: darwin-x64
            os: macos-15-intel
          - key: darwin-arm64
            os: macos-14
          # scriptc has no Windows libnode pack yet, so the dev host's Node island cannot be
          # built there. The job packs the host when one lands; until then it records a notice
          # and a release carries the four platforms that can run `native dev`'s island.
          - key: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The Linux host links cairo, freetype, fontconfig, harfbuzz, libpng, libjpeg, libgif,
      # dbus, ALSA, EGL, GL and sqlite; these are the packages its headers and archives come from.
      - name: Install the Linux host's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld pkg-config \
            libcairo2-dev libfreetype-dev libfontconfig-dev libharfbuzz-dev \
            libpng-dev libjpeg-dev libgif-dev libdbus-1-dev libasound2-dev \
            libegl-dev libgl-dev libgl1-mesa-dri libsqlite3-dev

      # scriptc links a Windows program with zig, so the host's objects are zig builds too.
      - name: Install zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "0.17.1"
          $root = "$env:RUNNER_TEMP\zig-$version"
          if (-not (Test-Path "$root\zig.exe")) {
            Invoke-WebRequest -UseBasicParsing "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
            Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig-unpack" -Force
            Move-Item "$env:RUNNER_TEMP\zig-unpack\zig-x86_64-windows-$version" $root
          }
          "$root" | Out-File -Append -FilePath $env:GITHUB_PATH
          & "$root\zig.exe" version

      - run: pnpm install --frozen-lockfile

      # The dev host embeds a Node island, and scriptc builds one only against a libnode pack.
      # Windows has none, so there is nothing to build there yet; the package and the CLI's
      # lookup are ready for the day a pack ships, and this job then packs a host for it too.
      - name: Check for this platform's libnode pack
        id: libnode
        shell: bash
        run: |
          if node --input-type=module -e 'import { libnodePackageName } from "./packages/cli/compiler/dev-host.ts"; process.exit(libnodePackageName() === null ? 1 : 0)'; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=win32-x64 dev host skipped::scriptc has no Windows libnode pack, so the dev host's Node island cannot be built; the package and the CLI lookup are ready for when one lands."
          fi

      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/pack

      # Unpack the CLI exactly as npm will install it, so the digest recorded in host.json is
      # the one an install computes over its own files.
      - name: Unpack the CLI package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-package"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/cli-package" --strip-components=1

      - name: Build the dev host into its package
        if: steps.libnode.outputs.supported == 'true'
        shell: bash
        run: node packages/cli/scripts/prebuilt-dev-host.ts "packages/dev-host-${{ matrix.key }}" --force --sdk-root "$RUNNER_TEMP/cli-package"

      - name: Pack the dev-host package
        if: steps.libnode.outputs.supported == 'true'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/packages" && (cd "packages/dev-host-${{ matrix.key }}" && pnpm pack --pack-destination "$RUNNER_TEMP/packages")

      - name: Check the package holds the host and its manifest
        if: steps.libnode.outputs.supported == 'true'
        shell: bash
        run: |
          tarball=$(ls "$RUNNER_TEMP"/packages/*.tgz)
          tar -tzf "$tarball" | grep -q -x -e 'package/host' -e 'package/host.exe'
          tar -tzf "$tarball" | grep -q -x 'package/host.json'

      - uses: actions/upload-artifact@v4
        if: steps.libnode.outputs.supported == 'true'
        with:
          name: dev-host-${{ matrix.key }}
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: [cli, dev-host]
    # A version tag releases; a manual run can ask for one. Without either, this workflow only
    # builds and packs, which is what a pull request check would run.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-22.04
    # Every publish waits for a reviewer on the repository's `npm-publish`
    # environment (Settings -> Environments -> required reviewers).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          pattern: "*"
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer for the OIDC exchange.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      # Platform packages first: the CLI's optionalDependencies name them, so they must exist
      # before the CLI that asks for them is published.
      - name: Publish the dev-host packages
        run: |
          for tarball in $(ls "$RUNNER_TEMP"/dist/dev-host-*.tgz); do
            npm publish "$tarball" --provenance --access public
          done
      - name: Publish the CLI
        run: |
          for tarball in $(ls "$RUNNER_TEMP"/dist/native-sdk-cli-*.tgz); do
            npm publish "$tarball" --provenance --access public
          done
