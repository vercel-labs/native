<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="native-window" content="width=880, height=560">
<title>Phases</title>
<style>
html, body { margin: 0; height: 100%; background: #070b16; color: #e8eefc; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud {
  position: fixed;
  inset: auto auto max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  font: 13px/1.4 system-ui, sans-serif;
  opacity: 0.7;
}
#hud b { color: #8be9fd; font-weight: 600; }
@media (max-width: 520px) {
  #hud { font-size: 11px; }
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">MODE <b id="mode">ORBITS</b> · SPACE, ENTER OR CLICK TO SWITCH</div>
<script>
// Phases: a small animated canvas piece with three modes. Space, enter or a click cycles them,
// and the last mode is kept in localStorage.
const stage = document.getElementById("stage") as HTMLCanvasElement;
const modeEl = document.getElementById("mode")!;
const ctx = stage.getContext("2d")!;

const MODES = ["orbits", "spiral", "ripples"];
let mode = 0;
const saved = localStorage.getItem("phases.mode");
if (saved !== null) {
  const n = parseInt(saved, 10);
  if (n >= 0 && n < MODES.length) mode = n;
}
modeEl.textContent = MODES[mode].toUpperCase();

// Reduced motion holds the animation still, but the mode and the resize still redraw.
const calm = matchMedia("(prefers-reduced-motion: reduce)");

let width = 0;
let height = 0;
let phase = 0;
let last = -1; // the previous frame's timestamp; -1 until the first one

// The canvas bitmap is sized in device pixels and the drawing is scaled once, so everything
// below can work in CSS pixels.
function resizeToWindow(): void {
  const dpr = window.devicePixelRatio;
  width = window.innerWidth;
  height = window.innerHeight;
  stage.width = Math.max(1, Math.round(width * dpr));
  stage.height = Math.max(1, Math.round(height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeToWindow();
window.addEventListener("resize", resizeToWindow);

function glow(x: number, y: number, r: number, color: string): void {
  // Additive light: overlapping glows brighten each other instead of covering up.
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function orbit(cx: number, cy: number, r: number, angle: number, hue: number, size: number): void {
  const x = cx + Math.cos(angle) * r;
  const y = cy + Math.sin(angle) * r;
  glow(x, y, size * 5, `hsla(${hue}, 90%, 65%, 0.55)`);
  ctx.fillStyle = `hsl(${hue}, 85%, 72%)`;
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.fill();
}

function drawOrbits(cx: number, cy: number, unit: number, t: number): void {
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const r = unit * (0.22 + i * 0.13);
    ctx.strokeStyle = "rgba(139, 233, 253, 0.13)";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    orbit(cx, cy, r, t * (1.1 - i * 0.17) + i * 1.4, 190 + i * 34, 3 + i * 0.8);
  }
  glow(cx, cy, unit * 0.3, "rgba(255, 236, 190, 0.85)");
  ctx.fillStyle = "#fff5d6";
  ctx.beginPath();
  ctx.arc(cx, cy, unit * 0.035, 0, Math.PI * 2);
  ctx.fill();
}

function drawSpiral(cx: number, cy: number, unit: number, t: number): void {
  // One stroked segment at a time, each a little lighter and further around, with round caps.
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 2.4;
  let px = cx;
  let py = cy;
  for (let i = 1; i <= 190; i++) {
    const a = i * 0.19 + t * 0.7;
    const r = i * unit * 0.0042;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    ctx.strokeStyle = `hsla(${(200 + i * 0.6 + t * 18) % 360}, 85%, 68%, ${0.12 + (i / 190) * 0.55})`;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(x, y);
    ctx.stroke();
    px = x;
    py = y;
  }
  ctx.restore();
  glow(cx, cy, unit * 0.42, "rgba(139, 233, 253, 0.35)");
  ctx.fillStyle = "#e8eefc";
  ctx.beginPath();
  ctx.arc(px, py, 3.4, 0, Math.PI * 2);
  ctx.fill();
}

function drawRipples(cx: number, cy: number, unit: number, t: number): void {
  ctx.lineWidth = 2;
  const max = unit * 0.95;
  for (let k = 0; k < 7; k++) {
    const r = ((t * 46 + k * (max / 7)) % max) + 6;
    const fade = 1 - r / max;
    ctx.strokeStyle = `hsla(${188 + k * 9}, 80%, 66%, ${fade * 0.75})`;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  glow(cx, cy, unit * 0.22 * (1.3 + Math.sin(t * 2) * 0.3), "rgba(139, 233, 253, 0.6)");
}

function draw(): void {
  ctx.fillStyle = "#070b16";
  ctx.fillRect(0, 0, width, height);
  const cx = width / 2;
  const cy = height / 2 - 10;
  const unit = Math.min(width, height);
  const t = phase;

  if (mode === 0) drawOrbits(cx, cy, unit, t);
  else if (mode === 1) drawSpiral(cx, cy, unit, t);
  else drawRipples(cx, cy, unit, t);

  // The title and the hint are drawn on the canvas itself, so they scale with the window.
  ctx.fillStyle = "rgba(232, 238, 252, 0.9)";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(MODES[mode].toUpperCase(), cx, 44);
  ctx.globalAlpha = 0.45;
  ctx.font = "12px sans-serif";
  ctx.fillText(calm.matches ? "reduced motion" : "phases", cx, 70);
  ctx.globalAlpha = 1;
}

function cycle(): void {
  mode = (mode + 1) % MODES.length;
  modeEl.textContent = MODES[mode].toUpperCase();
  localStorage.setItem("phases.mode", String(mode));
  last = -1;
  draw();
}

window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter" || e.code === "Space" || e.code === "Enter") cycle();
});
document.addEventListener("click", cycle);

function tick(now: number): void {
  const dt = last < 0 ? 0 : (now - last) / 1000;
  last = now;
  if (!calm.matches) phase += Math.min(0.1, dt);
  draw();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
